services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lister
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: lister
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lister"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lister:change-me@postgres/lister
      LISTER_BIND: 0.0.0.0:8080
    ports:
      - "8400:8080"

volumes:
  pgdata:
