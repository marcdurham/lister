services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lister
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: lister
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lister"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lister:${POSTGRES_PASSWORD:-change-me}@postgres/lister
      LISTER_BIND: 0.0.0.0:8080
      # Set these to enable "Import from Google Tasks" (create an OAuth client at
      # console.cloud.google.com/apis/credentials and register the redirect URI below).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8400/api/google/callback}
      # Comma-separated emails that are auto-approved as admins on registration (and
      # re-synced to admin status on every start, in case they registered earlier).
      DEFAULT_ADMINISTRATORS: ${DEFAULT_ADMINISTRATORS:-}
    ports:
      - "8400:8080"

volumes:
  pgdata:
