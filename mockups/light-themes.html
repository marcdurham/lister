<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lister Light Themes</title>
<style>
:root {
    color-scheme: light;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: #2a2f36; color: #e9ecef; }
.top { max-width: 1200px; margin: 0 auto; padding: 1.5rem 16px .5rem; }
.top h1 { margin: 0; font-size: 1.4rem; }
.top p { margin: .3rem 0 0; color: #adb5bd; font-size: .9rem; max-width: 70ch; }
.grid {
    max-width: 1200px; margin: 0 auto; padding: 1rem 16px 3rem;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem;
}
.card h2 { margin: 0 0 .15rem; font-size: 1rem; }
.card h2 span { color: #868e96; font-weight: 500; margin-right: .3rem; }
.card .why { margin: 0 0 .6rem; color: #adb5bd; font-size: .8rem; line-height: 1.35; min-height: 2.2em; }
.swatches { display: flex; gap: 4px; margin-top: .6rem; flex-wrap: wrap; }
.swatches span {
    font: 11px ui-monospace, monospace; padding: 2px 6px; border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, .15);
}

/* ---------- the mock app; every color is a variable set per theme below ---------- */
.app {
    background: var(--page); color: var(--text); border-radius: 14px; padding: 12px 12px 16px;
    border: 1px solid rgba(255, 255, 255, .1);
}
.hdr { display: flex; justify-content: flex-end; gap: 6px; }
.round { width: 28px; height: 28px; border-radius: 999px; background: var(--btn); color: var(--btn-text); display: flex; align-items: center; justify-content: center; }
.round svg { width: 14px; height: 14px; }
.crumbs { margin: 8px 0 8px; font-size: .8rem; display: flex; gap: 6px; align-items: center; }
.crumbs a { color: var(--accent); }
.crumbs .n { font-size: .7rem; padding: 0 .4rem; border-radius: 999px; background: var(--badge); color: var(--badge-text); }
.composer { display: flex; gap: 6px; }
.composer .search { width: 34px; border-radius: 6px; border: 1px solid var(--input-border); background: var(--input); }
.composer .input { flex: 1; border-radius: 6px; border: 1px solid var(--input-border); background: var(--input); color: var(--muted); padding: .45rem .6rem; font-size: .85rem; }
.composer .kind { border-radius: 6px; background: var(--btn); color: var(--btn-text); padding: .45rem .5rem; font-size: .8rem; }
.composer .add { border-radius: 6px; background: var(--accent-strong); color: #fff; padding: .45rem .7rem; font-size: .8rem; }
.subbar { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: .7rem; color: var(--soft); }
.subbar .copy { background: var(--btn); color: var(--btn-text); padding: .15rem .5rem; border-radius: 999px; }

.items { list-style: none; margin: 0; padding: 0; }
.item { background: var(--row); padding: .6rem .8rem; }
.item + .item { border-top: 1px solid var(--divider); }
.item:first-child { border-radius: 8px 8px 0 0; }
.item:last-child { border-radius: 0 0 8px 8px; }
.item-main { display: flex; align-items: flex-start; gap: .5rem; }
.item-main > .ico, .item-main > input { margin-top: .2em; flex-shrink: 0; }
.ico { width: 16px; height: 16px; display: flex; }
.ico.note { color: var(--note); } .ico.list { color: var(--accent); } .ico.link { color: var(--link); }
input[type="checkbox"] { width: 16px; height: 16px; margin: .2em 0 0; accent-color: var(--accent-strong); }
.title-group { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.text { font-size: 1.2rem; }
.preview { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.done .text { text-decoration: line-through; color: var(--muted); }
.count { font-size: .7rem; color: var(--badge-text); background: var(--badge); padding: .1rem .45rem; border-radius: 999px; margin-top: .35em; }
.edit { color: var(--muted); width: 1.6rem; display: flex; justify-content: center; margin-top: .25em; }

/* ---------- themes ---------- */
.t-current {
    --page: #f5f6f8; --row: #fff; --divider: #e4e7eb; --text: #1f2933; --soft: #616e7c; --muted: #9aa5b1;
    --btn: #e4e7eb; --btn-text: #495057; --input: #fff; --input-border: #cbd2d9;
    --badge: #e4e7eb; --badge-text: #616e7c;
    --accent: #1f6feb; --accent-strong: #1f6feb; --note: #7048e8; --link: #0c8599;
}
.t-soft {
    --page: #dde1e6; --row: #eceff2; --divider: #cfd5dc; --text: #1f2933; --soft: #52606d; --muted: #7b8794;
    --btn: #c9d0d8; --btn-text: #3e4c59; --input: #eceff2; --input-border: #b8c1cb;
    --badge: #cfd5dc; --badge-text: #3e4c59;
    --accent: #1a5fd0; --accent-strong: #1f6feb; --note: #6741d9; --link: #0b7285;
}
.t-paper {
    --page: #e6dfd1; --row: #f2ecdf; --divider: #dcd2bf; --text: #3a3226; --soft: #6b5f4c; --muted: #9a8c74;
    --btn: #d8cdb8; --btn-text: #4f4535; --input: #f2ecdf; --input-border: #cbbfa7;
    --badge: #ddd2bd; --badge-text: #5c5140;
    --accent: #2f5fa8; --accent-strong: #3a6bb8; --note: #7a4fb5; --link: #2b7a6f;
}
.t-slate {
    --page: #c9d2dc; --row: #dfe5ec; --divider: #c3ccd7; --text: #1b2733; --soft: #475666; --muted: #6c7b8b;
    --btn: #b6c1ce; --btn-text: #2f3d4c; --input: #dfe5ec; --input-border: #a9b5c3;
    --badge: #c3ccd7; --badge-text: #2f3d4c;
    --accent: #1559c4; --accent-strong: #1f63d6; --note: #5f3dc4; --link: #0b6b7a;
}
.t-dim {
    --page: #b4bbc3; --row: #cdd2d8; --divider: #b9c0c8; --text: #111820; --soft: #39434e; --muted: #5d6874;
    --btn: #a3abb5; --btn-text: #222c36; --input: #cdd2d8; --input-border: #98a1ac;
    --badge: #b0b8c1; --badge-text: #222c36;
    --accent: #0f4fb8; --accent-strong: #1a5bcc; --note: #5233b0; --link: #085f6c;
}
.t-sage {
    --page: #d5ddd4; --row: #e6ece5; --divider: #cad4c9; --text: #232b24; --soft: #4f5d50; --muted: #7a877a;
    --btn: #c3cec2; --btn-text: #384539; --input: #e6ece5; --input-border: #b3c0b2;
    --badge: #cad4c9; --badge-text: #384539;
    --accent: #1d62c4; --accent-strong: #2369d1; --note: #6a42c8; --link: #0d7268;
}
</style>
</head>
<body>
<div class="top">
    <h1>Less-light light mode</h1>
    <p>Five dimmer light palettes shown on a mock of the list page, with the new row dividers. #0 is today's light mode for comparison. The swatches under each frame are page / row / divider / text.</p>
</div>
<div class="grid" id="grid"></div>

<script>
const ICONS = {
    note: '<svg viewBox="0 0 16 16" width="16" height="16"><rect x="2" y="1.5" width="12" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="4.5" y1="5" x2="11.5" y2="5" stroke="currentColor" stroke-width="1.1"/><line x1="4.5" y1="7.7" x2="11.5" y2="7.7" stroke="currentColor" stroke-width="1.1"/><line x1="4.5" y1="10.4" x2="9" y2="10.4" stroke="currentColor" stroke-width="1.1"/></svg>',
    list: '<svg viewBox="0 0 16 16" width="16" height="16"><circle cx="2.2" cy="3.2" r="1" fill="currentColor"/><circle cx="2.2" cy="8" r="1" fill="currentColor"/><circle cx="2.2" cy="12.8" r="1" fill="currentColor"/><line x1="5" y1="3.2" x2="14" y2="3.2" stroke="currentColor" stroke-width="1.3"/><line x1="5" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.3"/><line x1="5" y1="12.8" x2="14" y2="12.8" stroke="currentColor" stroke-width="1.3"/></svg>',
    link: '<svg viewBox="0 0 16 16" width="16" height="16"><path d="M6.8 9.2a2.6 2.6 0 0 0 3.7 0l2.3-2.3a2.6 2.6 0 0 0-3.7-3.7l-1 1" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M9.2 6.8a2.6 2.6 0 0 0-3.7 0L3.2 9.1a2.6 2.6 0 0 0 3.7 3.7l1-1" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>',
    dots: '<svg viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="3" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="13" r="1.3" fill="currentColor"/></svg>',
    trash: '<svg viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 9h5.6l.7-9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
    menu: '<svg viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h10" stroke="currentColor" stroke-width="1.4"/></svg>',
};

const ITEMS = [
    { kind: "list", text: "Groceries", count: 12 },
    { kind: "task", text: "Call the dentist about Thursday" },
    { kind: "note", text: "Packing ideas", preview: "Rain jacket, charger, the good socks…" },
    { kind: "task", text: "Renew car registration", done: true },
    { kind: "link", text: "Recipe: lemon orzo", preview: "cooking.example.com/lemon-orzo" },
    { kind: "task", text: "Water the plants" },
];

const THEMES = [
    ["current", "Current light", "Today: near-white page and pure white rows. Bright, and glaring at night.", ["#f5f6f8", "#fff", "#e4e7eb", "#1f2933"]],
    ["soft", "Soft gray", "The same cool neutrals, about one step darker. Rows are off-white instead of white.", ["#dde1e6", "#eceff2", "#cfd5dc", "#1f2933"]],
    ["paper", "Warm paper", "Sepia/parchment tones with brown-black text. Easy on the eyes, like an e-reader.", ["#e6dfd1", "#f2ecdf", "#dcd2bf", "#3a3226"]],
    ["slate", "Slate mist", "Blue-gray, darker than soft gray. Fits the app's existing slate dark theme.", ["#c9d2dc", "#dfe5ec", "#c3ccd7", "#1b2733"]],
    ["dim", "Dim gray", "The darkest that still reads as a light theme, with near-black text for contrast.", ["#b4bbc3", "#cdd2d8", "#b9c0c8", "#111820"]],
    ["sage", "Sage", "A muted green-gray. Calm, slightly natural, and still neutral enough for any list.", ["#d5ddd4", "#e6ece5", "#cad4c9", "#232b24"]],
];

function row(it) {
    const icon = it.kind === "task"
        ? `<input type="checkbox" ${it.done ? "checked" : ""} tabindex="-1">`
        : `<span class="ico ${it.kind}">${ICONS[it.kind]}</span>`;
    return `<li class="item${it.done ? " done" : ""}"><div class="item-main">${icon}
        <div class="title-group"><span class="text">${it.text}</span>${it.preview ? `<span class="preview">${it.preview}</span>` : ""}</div>
        ${it.count ? `<span class="count">${it.count}</span>` : ""}
        <span class="edit">${ICONS.dots}</span></div></li>`;
}

function swatch(c) {
    const dark = parseInt(c.slice(1, 3), 16) < 128;
    return `<span style="background:${c};color:${dark ? "#fff" : "#000"}">${c}</span>`;
}

document.getElementById("grid").innerHTML = THEMES.map(([id, name, why, sw], i) => `
    <section class="card">
        <h2><span>${i}.</span>${name}</h2>
        <p class="why">${why}</p>
        <div class="app t-${id}">
            <div class="hdr"><span class="round">${ICONS.trash}</span><span class="round">${ICONS.menu}</span></div>
            <div class="crumbs"><a>Lists</a><span class="n">3</span><span>›</span><span>Home</span></div>
            <div class="composer"><span class="search"></span><span class="input">Add a note...</span><span class="kind">Note ▾</span><span class="add">Add</span></div>
            <div class="subbar"><span>☐ Show hidden items</span><span class="copy">Copy list</span></div>
            <ul class="items">${ITEMS.map(row).join("")}</ul>
        </div>
        <div class="swatches">${sw.map(swatch).join("")}</div>
    </section>`).join("");
</script>
</body>
</html>
