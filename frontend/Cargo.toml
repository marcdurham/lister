[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Storage", "Window", "Navigator", "Location", "History",
    "Document", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlInputElement",
    "HtmlSelectElement", "HtmlTextAreaElement", "Clipboard",
    "Blob", "BlobPropertyBag", "Url", "File", "FileList", "FileReader", "Event", "ProgressEvent",
    "DragEvent", "DataTransfer", "PopStateEvent", "PointerEvent",
] }
gloo-storage = "0.3"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-events = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js", "serde"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
shared = { path = "../shared" }
